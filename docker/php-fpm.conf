; PHP-FPM pool config. Logs to stderr so dokwe picks them up alongside
; nginx access logs. Worker count is a sensible starting point for a
; 1-2 vCPU container; tune once real traffic shape is known.

[global]
error_log = /dev/stderr
daemonize = no

[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000
listen.allowed_clients = 127.0.0.1

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 1000

; Surface slow requests in production logs so we can spot regressions
; before they become user-visible.
request_terminate_timeout = 60s
request_slowlog_timeout = 5s
slowlog = /dev/stderr

catch_workers_output = yes
decorate_workers_output = no

; Forward only the env vars we need. Laravel reads everything else from
; the actual process environment.
clear_env = no
