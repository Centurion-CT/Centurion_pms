# Minimal Laravel-aware nginx config. Runs in the foreground; PHP-FPM
# listens on 127.0.0.1:9000 inside the same container.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Access logs to stdout so dokwe's log aggregator picks them up.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    types_hash_max_size 2048;
    server_tokens off;

    # Match dokwe's upload ceiling. Bump if tenants need bigger media uploads
    # (media-library default is 50MB-ish; raise here in lockstep with PHP's
    # upload_max_filesize / post_max_size in docker/php.ini).
    client_max_body_size 64M;
    client_body_timeout 60;
    client_header_timeout 60;
    send_timeout 60;

    # Trust X-Forwarded-* coming from dokwe's edge so Laravel sees the real
    # client IP and scheme. dokwe terminates TLS upstream.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml application/rss+xml
               application/atom+xml image/svg+xml;

    server {
        listen 8080 default_server;
        server_name _;
        root /var/www/html/public;
        index index.php;

        # Cheap k8s/dokwe readiness probe — bypasses PHP so a slow boot
        # doesn't fail health checks. Laravel's /up still works (and is what
        # actual smoke tests should hit).
        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # Long-lived caching for vite-built assets. They carry content hashes
        # in the filename so immutable is safe.
        location ^~ /build/ {
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Static assets first, then fall through to index.php.
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO       $fastcgi_path_info;
            fastcgi_read_timeout 60;
        }

        # Block access to dotfiles + vendored sources just in case.
        location ~ /\.(?!well-known).* { deny all; }
        location ~ ^/(vendor|storage)/ { deny all; }
    }
}
