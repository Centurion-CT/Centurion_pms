; Production PHP tuning for keverna. Mounted at /usr/local/etc/php/conf.d/
; so it overrides defaults without touching the base image.

memory_limit = 256M
max_execution_time = 60
post_max_size = 64M
upload_max_filesize = 64M
max_input_vars = 5000

; Log everything to stderr. Laravel handles its own log routing — these
; settings catch the stray PHP warnings/errors that don't go through Monolog.
log_errors = On
error_log = /dev/stderr
display_errors = Off
display_startup_errors = Off
expose_php = Off

; Use the system timezone so date_default_timezone_get() returns something
; sensible if Laravel hasn't set it yet. APP_TIMEZONE overrides at runtime.
date.timezone = UTC

; OPcache — the single biggest perf win for Laravel under FPM.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Validate_timestamps=0 means deploys must restart the container to pick
; up new code. That's how dokwe rolls images anyway.
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.fast_shutdown = 1
opcache.jit_buffer_size = 128M
opcache.jit = tracing

; Realpath cache — small but free perf for Laravel's many require()s.
realpath_cache_size = 4096K
realpath_cache_ttl = 600
