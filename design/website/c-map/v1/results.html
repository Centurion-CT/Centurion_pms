<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Centurion Apartments · Option C · Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --white: #FFFFFF; --mist: #EEF3F8; --navy: #0F2A44; --ink-2: #4B5D70; --ink-3: #8193A5; --line: #DCE4EC;
    --blue: #336799; --blue-2: #285481; --mint: #1B8F6A; --mint-wash: #E1F3EC; --sun: #F2B33D; --sun-wash: #FDF1D8;
    --font: 'Hanken Grotesk', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--white); color: var(--navy); font: 400 16px/1.5 var(--font); display: flex; flex-direction: column; }
  a { color: inherit; }
  img { display: block; max-width: 100%; }
  :focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; border-radius: 6px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; height: 44px; padding: 0 18px; border: 0; border-radius: 12px; background: var(--blue); color: #fff; font: 700 15px var(--font); text-decoration: none; cursor: pointer; }
  .btn:hover { background: var(--blue-2); }

  .top { display: flex; align-items: center; gap: 24px; height: 76px; padding: 0 24px; border-bottom: 1px solid var(--line); flex: none; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 800; font-size: 18px; }
  .brand img { width: 28px; }
  .pill { display: flex; align-items: center; margin: 0 auto; background: var(--white); border-radius: 999px; box-shadow: 0 0 0 1px var(--line), 0 6px 16px -10px rgba(15,42,68,.3); padding: 4px 4px 4px 8px; }
  .pill span { padding: 6px 18px; border-right: 1px solid var(--line); font-size: 14px; font-weight: 600; }
  .pill span small { display: block; font-size: 11px; color: var(--ink-3); font-weight: 600; }
  .pill span:last-of-type { border: 0; }
  .pill .btn { border-radius: 999px; height: 42px; }

  .bar { display: flex; gap: 8px; padding: 14px 24px; border-bottom: 1px solid var(--line); flex: none; overflow-x: auto; }
  .chip { flex: none; height: 38px; padding: 0 14px; border-radius: 999px; border: 0; background: var(--mist); font: 600 14px var(--font); color: var(--navy); cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--navy); color: #fff; }
  .bar .sep { width: 1px; background: var(--line); margin: 4px 6px; flex: none; }

  .split { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 44%; }
  .list { overflow: auto; padding: 22px 24px 40px; }
  .list-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 18px; }
  .list-head h1 { margin: 0; font-size: 22px; letter-spacing: -0.02em; }
  .list-head span { font-size: 14px; color: var(--ink-2); }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px 18px; }
  .apt { cursor: pointer; border-radius: 18px; padding: 8px; margin: -8px; }
  .apt:hover, .apt.on { background: var(--mist); }
  .apt figure { margin: 0 0 10px; border-radius: 14px; overflow: hidden; aspect-ratio: 4 / 3; position: relative; }
  .apt img { width: 100%; height: 100%; object-fit: cover; }
  .apt .badge { position: absolute; top: 10px; left: 10px; height: 26px; padding: 0 10px; border-radius: 8px; background: var(--white); font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; }
  .apt .badge.low { background: var(--sun-wash); color: #8A5A00; }
  .apt .line1 { display: flex; justify-content: space-between; gap: 10px; }
  .apt h2 { margin: 0; font-size: 17px; }
  .apt .rating { font-size: 14px; font-weight: 600; white-space: nowrap; }
  .apt p { margin: 0; font-size: 14px; color: var(--ink-2); }
  .apt .price { margin-top: 6px; font-size: 15px; }
  .apt .price b { font-size: 17px; }
  .apt .price s { color: var(--ink-3); margin-right: 4px; }

  .mapside { position: relative; background: #E6EDF4; border-left: 1px solid var(--line); overflow: hidden; display: flex; flex-direction: column; }
  .mapside .abuja-map { display: block; width: 100%; height: auto; font-family: var(--font); }
  .map-land { fill: #E6EDF4; } .map-green { fill: #D6E8DE; } .map-water { fill: #BFD5EA; }
  .map-road { fill: none; stroke: #fff; stroke-width: 3; } .map-road.major { stroke-width: 7; }
  .map-place { font-size: 10px; fill: var(--ink-3); font-weight: 500; }
  .map-pin { cursor: pointer; }
  .map-pin-halo { fill: var(--blue); opacity: .14; }
  .map-pin-dot { fill: var(--blue); stroke: #fff; stroke-width: 3; }
  .map-pin-label { font-size: 12px; font-weight: 800; fill: var(--navy); paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; }
  .map-pin.on .map-pin-dot { fill: var(--navy); }
  .map-pin.on .map-pin-halo { opacity: .3; }
  .map-pin.off { opacity: .3; }

  /* Booking panel over the map */
  .book { position: relative; margin: 0 20px 20px; flex: 1; min-height: 0; background: var(--white); border-radius: 20px; box-shadow: 0 24px 50px -20px rgba(15,42,68,.45); display: flex; flex-direction: column; overflow: hidden; }
  .book-in { display: grid; grid-template-columns: 200px 1fr; flex: 1; min-height: 0; }
  .book img { height: 100%; object-fit: cover; width: 100%; }
  .book-body { padding: 18px 20px; flex: 1; overflow: auto; }
  .book h3 { margin: 0; font-size: 20px; }
  .book .where { margin: 0 0 14px; font-size: 14px; color: var(--ink-2); }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 14px; font-size: 13px; text-align: center; }
  .cal b { font-size: 11px; color: var(--ink-3); font-weight: 600; }
  .cal span { padding: 4px 0; border-radius: 8px; }
  .cal .in { background: var(--navy); color: #fff; font-weight: 700; }
  .cal .mid { background: var(--mist); font-weight: 600; }
  .cal .gone { color: var(--ink-3); text-decoration: line-through; }
  .book dl { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin: 0; font-size: 15px; }
  .book dt { color: var(--ink-2); }
  .book dd { margin: 0; text-align: right; }
  .book dl .t { font-weight: 800; font-size: 18px; color: var(--navy); padding-top: 8px; border-top: 1px solid var(--line); }
  .book-foot { padding: 14px 20px 18px; border-top: 1px solid var(--line); }
  .book-foot { display: flex; align-items: center; gap: 16px; }
  .book-foot .sum { flex: 1; font-size: 13px; color: var(--ink-2); line-height: 1.35; }
  .book-foot .sum b { display: block; font-size: 22px; color: var(--navy); }
  .book-foot .btn { height: 52px; padding: 0 28px; font-size: 16px; }
  .x { position: absolute; top: 12px; right: 12px; width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--white); font-size: 18px; cursor: pointer; }

  @media (max-width: 1100px) {
    .split { grid-template-columns: 1fr; }
    .mapside { display: none; }
    .grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 720px) {
    .top { padding: 0 16px; }
    .brand span { display: none; }
    .pill span:nth-child(3) { display: none; }
    .pill span { padding: 4px 10px; }
    .bar, .list { padding-left: 16px; padding-right: 16px; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="home.html"><img src="../../assets/logo.png" alt=""><span>Centurion</span></a>
  <div class="pill" role="search">
    <span><small>Where</small>All locations</span>
    <span><small>When</small>6 – 9 Nov</span>
    <span><small>Guests</small>2</span>
    <button class="btn" type="button">Search</button>
  </div>
</header>
<div class="bar" id="bar"></div>
<div class="split">
  <div class="list">
    <div class="list-head"><h1 id="count"></h1><span>Total for 3 nights shown</span></div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="mapside" id="mapside"><div id="map"></div><aside class="book" id="book" aria-live="polite"></aside></div>
</div>

<script src="../../assets/data.js"></script>
<script>
  const L = CENTURION.locations, NIGHTS = 3;
  const pics = ['living-green.jpg', 'living-cream.jpg', 'bedroom-bright.jpg', 'living-open.jpg', 'living-window.jpg', 'living-cream-2.jpg', 'bedroom-dark.jpg', 'living-warm.jpg'];
  let where = 'all', size = 'any', picked = 'zone-4|0';
  const all = L.flatMap((l, li) => l.types.map((t, i) => ({ l, t, id: `${l.slug}|${i}`, img: pics[(li * 5 + i) % pics.length] }))).filter(x => x.t.left > 0);

  function bar() {
    document.getElementById('bar').innerHTML =
      [['all', 'All locations'], ...L.map(l => [l.slug, l.name])].map(([k, n]) => `<button class="chip" data-w="${k}" aria-pressed="${where === k}">${n}</button>`).join('') +
      '<span class="sep"></span>' +
      [['any', 'Any size'], ['studio', 'Studio & standard'], ['one', 'One bedroom'], ['two', 'Two bedrooms']].map(([k, n]) => `<button class="chip" data-s="${k}" aria-pressed="${size === k}">${n}</button>`).join('');
  }
  const sizeOf = t => /two/i.test(t.name) ? 'two' : /one/i.test(t.name) ? 'one' : 'studio';
  function list() {
    const shown = all.filter(x => (where === 'all' || x.l.slug === where) && (size === 'any' || sizeOf(x.t) === size));
    document.getElementById('count').textContent = `${shown.length} apartments free for 6–9 Nov`;
    document.getElementById('grid').innerHTML = shown.map(({ l, t, id, img }) => `
      <article class="apt ${picked === id ? 'on' : ''}" data-id="${id}" data-slug="${l.slug}" tabindex="0">
        <figure><img src="../../assets/${img}" alt=""><span class="badge ${t.left === 1 ? 'low' : ''}">${t.left === 1 ? 'Last one' : t.left + ' left'}</span></figure>
        <div class="line1"><h2>${t.name}, ${l.name}</h2>${l.rating ? `<span class="rating">★ ${l.rating}</span>` : ''}</div>
        <p>Sleeps ${t.sleeps} · kitchen · ${l.area}</p>
        <div class="price">${t.was ? `<s>${naira(t.was)}</s>` : ''}<b>${naira(t.rate)}</b> a night · ${naira(t.rate * NIGHTS)} total</div>
      </article>`).join('');
    document.querySelectorAll('.map-pin').forEach(p => p.classList.toggle('off', where !== 'all' && p.dataset.slug !== where));
  }
  function book() {
    const x = all.find(a => a.id === picked), el = document.getElementById('book');
    if (!x) { el.style.display = 'none'; return; }
    el.style.display = '';
    document.querySelectorAll('.map-pin').forEach(p => p.classList.toggle('on', p.dataset.slug === x.l.slug));
    const days = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
    const cells = Array.from({ length: 14 }, (_, i) => i + 2).map(d => `<span class="${d === 6 || d === 9 ? 'in' : d > 6 && d < 9 ? 'mid' : d === 12 || d === 13 ? 'gone' : ''}">${d}</span>`).join('');
    el.innerHTML = `
      <button class="x" aria-label="Close" data-close>×</button>
      <div class="book-in"><img src="../../assets/${x.img}" alt="">
      <div class="book-body">
        <h3>${x.t.name}</h3>
        <p class="where">Centurion ${x.l.name} · ${x.l.address}</p>
        <div class="cal">${days.map(d => `<b>${d}</b>`).join('')}${cells}</div>
        <dl><dt>${naira(x.t.rate)} × ${NIGHTS} nights</dt><dd>${naira(x.t.rate * NIGHTS)}</dd>
          ${x.t.was ? `<dt>You save</dt><dd style="color:var(--mint)">−${naira((x.t.was - x.t.rate) * NIGHTS)}</dd>` : ''}
</dl>
      </div></div>
      <div class="book-foot"><div class="sum"><b>${naira(x.t.rate * NIGHTS)}</b>Total · free cancellation until 24h before</div><button class="btn">Book and pay</button></div>`;
  }

  document.getElementById('map').innerHTML = abujaMap({ label: l => `${l.name}  ${naira(l.from)}` });
  document.addEventListener('click', e => {
    const w = e.target.closest('[data-w]'), s = e.target.closest('[data-s]'), a = e.target.closest('.apt'), pin = e.target.closest('.map-pin');
    if (w) where = w.dataset.w;
    if (s) size = s.dataset.s;
    if (pin) where = pin.dataset.slug;
    if (a) picked = a.dataset.id;
    if (e.target.closest('[data-close]')) picked = null;
    if (w || s || a || pin || e.target.closest('[data-close]')) { bar(); list(); book(); }
  });
  document.addEventListener('mouseover', e => {
    const a = e.target.closest('.apt'); if (!a) return;
    document.querySelectorAll('.map-pin').forEach(p => p.classList.toggle('on', p.dataset.slug === a.dataset.slug));
  });
  bar(); list(); book();
</script>
</body>
</html>
