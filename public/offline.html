<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline · Keverna POS</title>
    <meta name="theme-color" content="#1a1a22">
    <style>
        :root {
            --ink: #1a1a22;
            --ink-soft: #4a4a55;
            --cream: #fffcf5;
            --accent: #c08a2e;
            --line: #e6e2d7;
        }
        html, body {
            margin: 0; padding: 0; min-height: 100dvh;
            font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
            background: var(--cream); color: var(--ink);
            display: flex; align-items: center; justify-content: center;
        }
        .card {
            max-width: 420px; padding: 32px 26px;
            background: #fff; border: 1px solid var(--line); border-radius: 14px;
            margin: 20px; text-align: left;
        }
        .eyebrow {
            font-size: 11px; text-transform: uppercase; letter-spacing: 0.14em;
            color: var(--accent); font-weight: 600;
        }
        h1 { margin: 12px 0 8px; font-size: 26px; line-height: 1.12; font-weight: 600; }
        p { margin: 12px 0 0; color: var(--ink-soft); font-size: 15px; line-height: 1.55; }
        button {
            margin-top: 20px; padding: 10px 18px;
            background: var(--ink); color: var(--cream); border: 0; border-radius: 8px;
            font-family: inherit; font-size: 14px; cursor: pointer;
        }
    </style>
</head>
<body>
    <main class="card" data-testid="pos-offline-shell">
        <span class="eyebrow">Keverna POS</span>
        <h1>You're offline.</h1>
        <p>
            The terminal couldn't reach the server, and this page wasn't cached yet.
            Once you're back online, pull to reload — any sales you already queued
            will send automatically.
        </p>
        <button type="button" onclick="location.reload()">Try again</button>
    </main>
</body>
</html>
