# yaml-language-server: $schema=https://dokwe.com/schemas/dokwe.schema.json

# Generated by `dokwe init` — framework: laravel
# Detection signals:
#   • composer.json — laravel/framework dep → Laravel project
#   • composer.json — require.php → runtime.php: 8.5
#   • package.json — engines.node / default → runtime.node: 20
#   • composer.json deps — php ext: pdo_mysql, mbstring, intl, bcmath, curl, openssl, xml, tokenizer, fileinfo, ctype, json, redis
#   • composer.json — laravel/framework → services.queue (php artisan queue:work)
#   • routes/console.php — scheduled tasks → services.scheduler (cron, every minute)
#   • .env.example — parsed for env.required + env.defaults
#
# Edit freely. Run `dokwe validate` to check changes locally.

mode: native
host: control-plane

# Verified at deploy phase 3. The agent fails fast if anything below
# is missing on the host — operator owns first-boot install.
runtime:
  php: "8.5"
  node: "20"
  composer: "2.x"
  packages:
    - nginx
    - postgresql-client
    - redis-tools
    - certbot
    - python3-certbot-nginx
  extensions:
    - pdo_pgsql
    - mbstring
    - intl
    - bcmath
    - curl
    - openssl
    - xml
    - tokenizer
    - fileinfo
    - ctype
    - json
    # NB: no `redis` ext — REDIS_CLIENT is `predis` (pure-PHP client
    # via composer). Adding it back forces `pecl install redis`,
    # which has been failing with "No releases available for package
    # pecl.php.net/redis" on recent deploys. Switch to phpredis only
    # if we flip REDIS_CLIENT and want the perf bump.
    - pcntl          # add — laravel/horizon needs it
    - exif           # add — spatie/image + medialibrary need it
  


# Runs in a clean Docker sandbox on the control plane. Working tree
# after the last command becomes the .tar.gz artifact.
build:
  # Authenticate composer against GitHub codeload if a token is available.
  # Without it, unauthenticated dist downloads hit ~60/hr per egress IP and
  # fail with HTTP 429/504 mid-install (composer's `Source fallback is
  # disabled` means one bad response aborts the whole build). With a token
  # the ceiling is 5,000/hr. Guarded so a missing/rotated token doesn't
  # wedge the deploy — falls back to the anon rate that day.
  - '[ -n "$GITHUB_TOKEN" ] && composer config --global --auth github-oauth.github.com "$GITHUB_TOKEN" || true'
  - composer install --no-dev --optimize-autoloader --no-interaction
  - npm ci --no-audit --no-fund
  - npm run build

deploy:
  destination: /var/www/keverna
  keepReleases: 5
  owner:
    user: www-data
    group: www-data
  # Persisted across releases via symlinks into releases/<sha>/.
  shared:
    - .env
    - storage/app
    - storage/logs
    - storage/framework/sessions
    - storage/framework/cache
    - storage/framework/views
    - bootstrap/cache
    - public/storage

# Runs on the host after extract, BEFORE the symlink swap. Non-zero
# exit aborts and leaves the previous release active.
release:
  - php artisan migrate --force
  # First-run bootstrap: creates one platform admin from
  # INITIAL_ADMIN_EMAIL + INITIAL_ADMIN_PASSWORD env vars. Idempotent
  # by email — subsequent deploys refresh name/role but never overwrite
  # the password. Runs before caches so the seeder writes still land
  # even if a cache step later fails.
  - php artisan db:seed --class=ProductionAdminSeeder --force
  - php artisan storage:link
  - php artisan config:cache
  - php artisan route:cache
  - php artisan view:cache
  - php artisan event:cache

# Paired down-steps used by `dokwe rollback`.
release_rollback:
  - php artisan migrate:rollback --force

# Host services. Agent renders + applies idempotently every deploy.
services:
  web:
    kind: nginx+php-fpm
    root: public
    domain: keverna.com
    aliases:
      - www.keverna.com
    # Serve `keverna.com` + `*.keverna.com` on the same vhost so every
    # tenant subdomain lands in the Laravel app without per-tenant nginx
    # or LE issuance. Requires a pre-issued wildcard cert covering both
    # names as SANs (HTTP-01 can't issue wildcards).
    #
    # Prereqs on the box (do BEFORE pushing this commit):
    #   1. Namecheap: add A record `*.keverna.com` → 69.57.161.83.
    #   2. Delete the old HTTP-01 keverna cert so it doesn't fight the new one:
    #      `certbot delete --cert-name keverna.com`
    #   3. Issue the wildcard cert. Once the Namecheap hook is installed
    #      (infra/scripts/certbot-namecheap-hook.py) — same tooling as the
    #      dokwe.com-0001 wildcard — this becomes unattended:
    #        certbot certonly --cert-name keverna-wildcard \
    #          --preferred-challenges dns \
    #          --manual --manual-auth-hook /etc/letsencrypt/renewal-hooks/manual/namecheap-add \
    #                   --manual-cleanup-hook /etc/letsencrypt/renewal-hooks/manual/namecheap-remove \
    #          --agree-tos --no-eff-email \
    #          -d keverna.com -d '*.keverna.com'
    #      (Falls back to interactive TXT-record entry if the hook isn't set.)
    wildcardSubdomain: true
    sslMode: external
    sslCertificate: /etc/letsencrypt/live/keverna-wildcard/fullchain.pem
    sslCertificateKey: /etc/letsencrypt/live/keverna-wildcard/privkey.pem
    clientMaxBodySize: 64M
    healthCheck:
      type: http
      path: /
      expectStatus: [200, 301, 302]

  # `admin.keverna.com` no longer needs its own service block: the wildcard
  # vhost on `web:` (server_name keverna.com *.keverna.com) matches it, and
  # the wildcard cert covers admin.keverna.com in its SANs. Laravel's
  # Route::domain('admin.keverna.com') scoping routes admin URLs to the
  # right controllers. Removing the block also stops certbot from
  # installing admin's per-domain cert into web.conf every deploy —
  # `certbot --nginx --cert-name admin.keverna.com` matched the wildcard
  # server_name and clobbered the wildcard cert reference.
  #
  # After this commit deploys, run `certbot delete --cert-name
  # admin.keverna.com` on the host to retire the now-unused cert.

  queue:
    kind: systemd
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    restart: always
    restartSec: 5

  scheduler:
    kind: cron
    schedule: "* * * * *"
    command: php artisan schedule:run

env:
  file: .env
  # Aborts deploy at phase 2 if any of these aren't set in workspace vars.
  required:
    - APP_KEY
    - DB_PASSWORD
    - REDIS_PASSWORD
    - PAYSTACK_PUBLIC_KEY
    - PAYSTACK_SECRET_KEY
    - PAYSTACK_WEBHOOK_SECRET
    - SENDPIPE_API_KEY
    - GOOGLE_MAPS_API_KEY
    - NAMECHEAP_API_USER
    - NAMECHEAP_API_KEY
    - NAMECHEAP_USERNAME
    - WHOGOHOST_API_KEY
    - BUNNY_STORAGE_ZONE
    - BUNNY_STORAGE_API_KEY
    - BUNNY_PULL_ZONE_URL
    - REDIS_HOST
    - REDIS_PORT
    - DB_DATABASE
    - DB_HOST
    - DB_PORT
    - DB_USERNAME
    - DOKWE_ERRORS_PROJECT_ID
    - DOKWE_ERRORS_TOKEN
    # Consumed by ProductionAdminSeeder (release step). Email is required
    # every deploy; password is only required on the very first one when
    # the admin row is being created — after that it can be removed from
    # workspace vars since the seeder is idempotent and refuses to
    # overwrite an existing admin's password.
    - INITIAL_ADMIN_EMAIL
  defaults:
    ADMIN_DOMAIN: admin.keverna.com
    APP_DEBUG: "false"
    APP_ENV: production
    APP_FAKER_LOCALE: en_NG
    APP_FALLBACK_LOCALE: en
    APP_LOCALE: en
    APP_MAINTENANCE_DRIVER: file
    APP_NAME: Keverna
    APP_TIMEZONE: Africa/Lagos
    APP_URL: "https://keverna.com"
    BCRYPT_ROUNDS: "12"
    BROADCAST_CONNECTION: log
    BUNNY_REGION: de
    CACHE_PREFIX: keverna
    CACHE_STORE: redis
    CENTRAL_DOMAIN: keverna.com
    CUSTOM_DOMAIN_CNAME_TARGET: cname.keverna.com
    DB_CONNECTION: pgsql
    DB_PORT: "5432"
    FILESYSTEM_DISK: dokwe
    GRACE_PERIOD_DAYS: "3"
    KEVERNA_FEE_CAP_NGN: "2000"
    KEVERNA_FEE_PERCENT: "0.5"
    LOCK_TO_ARCHIVE_DAYS: "30"
    LOG_CHANNEL: stack
    LOG_LEVEL: warning
    LOG_STACK: single
    MAIL_FROM_ADDRESS: "communications@fregatelab.com"
    MAIL_MAILER: sendpipe
    MEDIA_DISK: public
    PAYSTACK_FEE_CAP_NGN: "2000"
    PAYSTACK_FEE_FLAT_NGN: "100"
    PAYSTACK_FEE_PERCENT: "1.5"
    QUEUE_CONNECTION: redis
    REDIS_CACHE_DB: "1"
    REDIS_CLIENT: predis
    REDIS_DB: "0"
    SENDPIPE_API_URL: "https://sendpipe.fregatelab.com/v1"
    SENDPIPE_WA_OTP_LANGUAGE: en
    SENDPIPE_WA_OTP_TEMPLATE: kev_otp
    SESSION_DRIVER: redis
    SESSION_ENCRYPT: "false"
    SESSION_LIFETIME: "120"
    SESSION_PATH: /
    SUBSCRIPTION_ANNUAL_NGN: "300000"
    TENANT_DOMAIN_SUFFIX: ".keverna.com"
    TRIAL_DAYS: "14"
    SESSION_DOMAIN: ".keverna.com"