name: centurion_staff
description: Centurion Staff. Housekeeping and porter app for Centurion Apartments.
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # Networking
  dio: ^5.7.0

  # State + navigation. Riverpod pinned to 2.6.x (plain providers, no codegen).
  flutter_riverpod: 2.6.1
  go_router: ^14.2.7

  # Persistence
  drift: ^2.20.2
  drift_flutter: ^0.2.1
  path_provider: ^2.1.4
  flutter_secure_storage: ^9.2.2

  # Device
  device_info_plus: ^10.1.2
  package_info_plus: ^8.0.2
  connectivity_plus: ^6.0.5

  # UI
  lucide_icons_flutter: ^3.1.19

  # Utils
  intl: ^0.20.2
  ulid: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.20.2

  # Brand asset generation (design-time only, not shipped in the app).
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/branding/logo.png
  fonts:
    - family: Bricolage
      fonts:
        - asset: assets/fonts/BricolageGrotesque-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
    - family: Hanken
      fonts:
        - asset: assets/fonts/HankenGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/HankenGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/HankenGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HankenGrotesk-Bold.ttf
          weight: 700

# Launcher icons (dart run flutter_launcher_icons). The Centurion mark on
# white; the adaptive icon uses the transparent foreground on white so it
# survives every Android 8+ launcher shape.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/icon_source.png
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  web:
    generate: true
    image_path: assets/branding/icon_source.png
    background_color: "#EEF3F7"
    theme_color: "#336799"

# Native splash (dart run flutter_native_splash:create). Paper background
# matches the app's screen colour so there is no flash on start.
flutter_native_splash:
  color: "#EEF3F7"
  image: assets/branding/splash_mark.png
  android_12:
    image: assets/branding/splash_mark.png
    color: "#EEF3F7"
    icon_background_color: "#FFFFFF"
  android: true
  ios: true
  web: false
