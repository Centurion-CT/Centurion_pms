# Windows desktop build for the Flutter operator app.
#
# Cross-compilation from macOS/Linux is not supported by Flutter's
# Windows toolchain (MSVC only ships on Windows), so this job runs on
# a windows-latest GitHub-hosted runner and uploads the release binaries
# as a downloadable artifact + a zip release.
#
# Trigger from the Actions tab (workflow_dispatch), or by pushing a
# tag matching `v*` (e.g. v1.0.0) — that path also drafts a GitHub
# Release and attaches Keverna-Windows.zip so operators can grab the
# install from the Releases page rather than digging through Actions.
name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Serialize concurrent runs on the same ref so a rapid re-trigger
# cancels the older build instead of paying for both.
concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned to the version we develop against locally (see
      # `flutter --version` in the repo). Bumping this should be a
      # deliberate PR so the CI binary matches what dev machines produce.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Show environment
        run: |
          flutter --version
          flutter config --enable-windows-desktop
          flutter doctor -v

      - name: Fetch dependencies
        run: flutter pub get

      # Release build with symbol split + obfuscation. Symbols go into
      # build/symbols/ and are uploaded separately so we can demangle
      # crashes later without shipping DWARF to end users.
      - name: Build Windows release
        run: >
          flutter build windows --release
          --obfuscate --split-debug-info=build/symbols

      # Bundle the runtime layout Flutter produces (Keverna.exe +
      # data/ + flutter_windows.dll + plugin dlls) into a portable zip
      # the user can extract and run.
      - name: Package as portable ZIP
        shell: pwsh
        run: |
          $release = "build/windows/x64/runner/Release"
          if (-not (Test-Path $release)) {
            Write-Error "Release output not found at $release"
            exit 1
          }
          Compress-Archive -Path "$release/*" -DestinationPath "Keverna-Windows.zip" -Force
          Get-Item Keverna-Windows.zip | Format-List Name, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Keverna-Windows
          path: mobile/Keverna-Windows.zip
          retention-days: 30
          if-no-files-found: error

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: Keverna-Windows-symbols
          path: mobile/build/symbols
          retention-days: 30
          if-no-files-found: warn

      # Only on tag pushes — draft a GitHub Release so operators can
      # download the zip from a stable URL rather than an Actions
      # artifact link that expires after 30 days.
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/Keverna-Windows.zip
          draft: true
          generate_release_notes: true
